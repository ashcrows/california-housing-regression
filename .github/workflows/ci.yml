name: CI/CD Pipeline

on:
  push:
    branches:
      - docker_ci

jobs:
  build_and_test_container:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: 3.13

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run train.py to generate the model
        run: |
          python3 train.py

      - name: Build Docker image
        run: |
          docker build -t california-housing-regression .

      - name: Run Docker container and verify
        run: |
          docker run --rm california-housing-regression python3 predict.py

      - name: Login and push Docker image to DockerHub
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin
          docker tag california-housing-regression "$DOCKER_USERNAME/california-housing-regression:latest"
          docker push "$DOCKER_USERNAME/california-housing-regression:latest"
